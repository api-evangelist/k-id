aid: k-id
name: k-ID
description: >-
  k-ID is a compliance platform that lets games, social apps, AI products, and
  commerce deliver age-appropriate experiences across 200+ jurisdictions. Its
  Compliance Development Kit (CDK) encodes auto-updating regulatory logic for
  regimes like COPPA, GDPR-Kids, the UK Age Appropriate Design Code and Online
  Safety Act, Brazil's ECA Digital, and Australia's minimum-age rules, while
  AgeKit and AgeKit+ provide privacy-preserving age assurance (facial age
  estimation, ID checks, credit card, AgeKey reusable credentials) and Family
  Connect handles verifiable parental consent. Developers integrate through the
  k-ID HTTP RPC API (game-api.k-id.com) using bearer API keys, hosted widget
  URLs, HMAC-signed webhooks, and official Agent Skills for AI coding tools.
